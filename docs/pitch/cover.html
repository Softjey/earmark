<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earmark cover</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; background: #0E1A17; font-family: "IBM Plex Sans", Helvetica, sans-serif; }
  .wrap { width: 1600px; height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          background: radial-gradient(800px 560px at 50% 50%, rgba(11,107,85,.32), transparent 70%), #0E1A17; }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand span { font-size: 150px; font-weight: 700; color: #fff; letter-spacing: -4px; }
  p { margin-top: 56px; font-size: 56px; font-weight: 600; letter-spacing: -1px; color: #B9C3BF; }
  p em { font-style: normal; color: #3FBF9A; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg width="160" height="160" viewBox="0 0 64 64" fill="none"><path d="M32 6 L54 19 V45 L32 58 L10 45 V19 Z" stroke="#3FBF9A" stroke-width="5" stroke-linejoin="round"/><circle cx="32" cy="32" r="6" fill="#fff"/></svg>
    <span>Earmark</span>
  </div>
  <p>Fundraising the organizer <em>can't touch.</em></p>
</div>
</body>
</html>
